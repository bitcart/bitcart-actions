name: Python Tests

on:
  workflow_call:
    inputs:
      python-versions:
        description: "JSON list of Python versions to test on"
        type: string
        default: '["3.12"]'
      install-dependencies:
        description: "Command to install dependencies"
        type: string
        default: "uv sync --frozen --compile-bytecode"
      install-daemon:
        description: "Install the Bitcart daemon and its system dependencies"
        type: boolean
        default: false
      daemon-repository:
        description: "Extra repository to checkout as daemon"
        type: string
        default: ""
      daemon-repository-branch:
        description: "Branch of the daemon repository to checkout"
        type: string
        default: ""
      daemon-dir:
        description: "Daemon directory, exposed to commands as $DAEMON_DIR"
        type: string
        default: "."
      background:
        description: "Command to keep running in the background during the tests"
        type: string
        default: ""
      regtest:
        description: "Start bitcoind, Fulcrum and the regtest daemons before the tests"
        type: boolean
        default: false
      tests:
        description: "Command to run the tests"
        type: string
        default: "just ci"
      coverage-name:
        description: "Codecov upload name, suffixed with the Python version"
        type: string
        default: "Tests"
      coverage-flag:
        description: "Codecov flag, also used in artifact names"
        type: string
        default: "tests"
      redis:
        description: "Start Redis on port 6379"
        type: boolean
        default: false
      postgres:
        description: "Start PostgreSQL on port 5432, with trust authentication"
        type: boolean
        default: false
      runs-on:
        description: "Runner label to run the job on"
        type: string
        default: "ubuntu-latest"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  run:
    name: ${{ matrix.python-version }}
    runs-on: ${{ inputs.runs-on }}

    permissions:
      contents: read
      id-token: write # OIDC token for codecov uploads

    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}

    services:
      redis:
        # renovate: datasource=docker depName=redis versioning=docker
        image: ${{ inputs.redis && 'redis:alpine@sha256:21090af93f8324db2f0f0f4f38a7c60369d47d917e000c3423d89d2ae2883537' || '' }}
        ports:
          - 6379:6379

      postgres:
        # renovate: datasource=docker depName=postgres versioning=docker
        image: ${{ inputs.postgres && 'postgres:18-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395' || '' }}
        env:
          POSTGRES_DB: bitcart_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432

    env:
      TEST_ARGS: "-o junit_family=legacy --junitxml test-results/junit.xml --cov-report html:coverage"
      DAEMON_DIR: ${{ inputs.daemon-dir }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: bitcart/bitcart-actions/actions/setup-python@master
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        if: ${{ !inputs.install-daemon }}
        env:
          INSTALL_DEPENDENCIES: ${{ inputs.install-dependencies }}
        run: bash -e -o pipefail <<< "$INSTALL_DEPENDENCIES"

      - name: Install daemon
        if: ${{ inputs.install-daemon }}
        uses: bitcart/bitcart-actions/actions/install-daemon@master
        with:
          daemon-repository: ${{ inputs.daemon-repository }}
          daemon-repository-branch: ${{ inputs.daemon-repository-branch }}
          daemon-dir: ${{ inputs.daemon-dir }}
          install-dependencies: ${{ inputs.install-dependencies }}

      - name: Install screen
        if: ${{ inputs.regtest }}
        run: |
          sudo apt update
          sudo apt install -y screen

      - name: Install bitcoind
        if: ${{ inputs.regtest }}
        uses: bitcart/bitcart-actions/actions/install-bitcoind@master

      - name: Install Fulcrum
        if: ${{ inputs.regtest }}
        uses: bitcart/bitcart-actions/actions/install-fulcrum@master

      - name: Start bitcoind
        if: ${{ inputs.regtest }}
        uses: bitcart/bitcart-actions/actions/run-in-background@master
        with:
          run: just bitcoind
          key: bitcoind

      - name: Start Fulcrum
        if: ${{ inputs.regtest }}
        uses: bitcart/bitcart-actions/actions/run-in-background@master
        with:
          run: sleep 10 && just fulcrum
          key: fulcrum

      - name: Start regtest daemon
        if: ${{ inputs.regtest }}
        uses: bitcart/bitcart-actions/actions/run-in-background@master
        with:
          run: sleep 10 && cd "$DAEMON_DIR" && just regtest
          key: regtest

      - name: Start regtest LN daemon
        if: ${{ inputs.regtest }}
        uses: bitcart/bitcart-actions/actions/run-in-background@master
        with:
          run: sleep 10 && cd "$DAEMON_DIR" && just regtestln
          key: regtestln

      - name: Start background command
        if: ${{ inputs.background != '' }}
        uses: bitcart/bitcart-actions/actions/run-in-background@master
        with:
          run: ${{ inputs.background }}
          key: background

      - name: Wait for regtest daemons
        if: ${{ inputs.regtest }}
        run: sleep 15

      - name: Run tests
        env:
          TESTS: ${{ inputs.tests }}
        run: bash -e -o pipefail <<< "$TESTS"

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: bitcart/bitcart-actions/actions/codecov@master
        with:
          name: ${{ inputs.coverage-name }} - Python ${{ env.PYTHON }}
          flags: ${{ inputs.coverage-flag }}
          env_vars: PYTHON
          upload_coverage: ${{ job.status == 'success' }}

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: bitcart/bitcart-actions/actions/upload-test-results@master
        with:
          suffix: ${{ inputs.coverage-flag }}-py${{ env.PYTHON }}-${{ inputs.runs-on }}
