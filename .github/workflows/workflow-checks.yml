name: Workflow Checks

on:
  workflow_call:
    inputs:
      zizmor:
        description: "Whether to run the zizmor audit (it only scans .github/workflows)"
        type: boolean
        default: true
      zizmor-paths:
        description: "The paths to run the zizmor audit on"
        type: string
        default: "."
      zizmor-advanced-security:
        description: "Whether to enable zizmor advanced security features (github only)"
        type: boolean
        default: true
      zizmor-persona:
        description: "Zizmor persona (regular, pedantic, auditor)"
        type: string
        default: "auditor"
      runs-on:
        description: "Runner label to run the job on"
        type: string
        default: "ubuntu-latest"

permissions:
  contents: read

jobs:
  run:
    name: run
    runs-on: ${{ inputs.runs-on }}

    permissions:
      contents: read
      security-events: write # needed for github advanced security

    env:
      # renovate: datasource=pypi depName=zizmor
      ZIZMOR_VERSION: "1.31.1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        if: ${{ inputs.zizmor }}
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          inputs: ${{ inputs.zizmor-paths }}
          advanced-security: ${{ inputs.zizmor-advanced-security }}
          persona: ${{ inputs.zizmor-persona }}
          version: ${{ env.ZIZMOR_VERSION }}

      - name: Fail on zizmor findings
        if: ${{ inputs.zizmor && inputs.zizmor-advanced-security }}
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          inputs: ${{ inputs.zizmor-paths }}
          advanced-security: false
          annotations: true
          persona: ${{ inputs.zizmor-persona }}
          version: ${{ env.ZIZMOR_VERSION }}

      - name: Check workflow layout
        if: ${{ !cancelled() }}
        uses: bitcart/bitcart-actions/actions/workflow-layout@master

      - name: Lint workflows
        if: ${{ !cancelled() }}
        uses: bitcart/bitcart-actions/actions/actionlint@master
        timeout-minutes: 10
