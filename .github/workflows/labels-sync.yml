name: Sync Labels

on:
  workflow_call:
    inputs:
      delete-other-labels:
        description: "Delete labels not present in the source config"
        type: boolean
        default: true
      runs-on:
        description: "Runner label to run the job on"
        type: string
        default: "ubuntu-latest"

permissions: {}

jobs:
  run:
    name: run
    runs-on: ${{ inputs.runs-on }}

    permissions:
      issues: write # to synchronize issue labels

    steps:
      - name: Sync labels (GitHub)
        if: ${{ contains(github.server_url, 'github.com') }}
        uses: EndBug/label-sync@52074158190acb45f3077f9099fea818aa43f97a # v2.3.3
        with:
          config-file: "https://raw.githubusercontent.com/bitcart/.github/master/labels.yml"
          delete-other-labels: ${{ inputs.delete-other-labels }}

      - name: Set up Python
        if: ${{ !contains(github.server_url, 'github.com') }}
        uses: bitcart/bitcart-actions/actions/setup-python@master
        with:
          cache-dependency-glob: ""

      - name: Sync labels (Forgejo)
        if: ${{ !contains(github.server_url, 'github.com') }}
        uses: bitcart/bitcart-actions/actions/forgejo-sync-labels@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          delete-other-labels: ${{ inputs.delete-other-labels }}
