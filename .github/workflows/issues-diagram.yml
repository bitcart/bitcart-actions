name: Issues Diagram

on:
  workflow_call:

jobs:
  run:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write

    steps:
      - name: Set up Python
        uses: bitcart/bitcart-actions/actions/setup-python@master
        with:
          cache-dependency-glob: ""

      - name: Generate diagrams
        env:
          ISSUES_DIAGRAM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run https://raw.githubusercontent.com/bitcart/bitcart-actions/refs/heads/master/scripts/issues-diagram.py

      - name: Update issue (GitHub)
        if: ${{ contains(github.server_url, 'github.com') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          REPO="${{ github.repository }}"
          LABEL_NAME="issues-diagram"
          ISSUE_TITLE="Issues diagram"

          # Build the issue body from generated diagrams
          BODY=""
          if [ -f "scripts/output/issues.md" ]; then
            BODY="$(cat scripts/output/issues.md)"$'\n\n'
          fi
          BODY+="_Last updated: $(date -u '+%Y-%m-%d %H:%M UTC')_"

          # Find existing issue by label using gh CLI
          ISSUE_NUMBER=$(gh issue list --repo "$REPO" --label "$LABEL_NAME" --state open --limit 1 --json number --jq '.[0].number // empty')

          if [ -n "$ISSUE_NUMBER" ]; then
            echo "Found existing issue #${ISSUE_NUMBER}, updating body..."
            gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --body "$BODY"
          else
            echo "No existing issue found, creating one..."
            gh issue create --repo "$REPO" --title "$ISSUE_TITLE" --label "$LABEL_NAME" --body "$BODY"
            echo "Created issue."
          fi

          echo "Done."

      - name: Update issue (Forgejo)
        if: ${{ !contains(github.server_url, 'github.com') }}
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          API_BASE="${{ github.server_url }}/api/v1"
          REPO="${{ github.repository }}"
          LABEL_NAME="issues-diagram"
          ISSUE_TITLE="Issues diagram"
          AUTH_HEADER="Authorization: token ${FORGEJO_TOKEN}"

          # Build the issue body from generated diagrams
          BODY=""
          if [ -f "scripts/output/issues.md" ]; then
            BODY="$(cat scripts/output/issues.md)"$'\n\n'
          fi
          BODY+="_Last updated: $(date -u '+%Y-%m-%d %H:%M UTC')_"

          # Find existing issue by label
          ISSUE_NUMBER=$(curl -sf -H "$AUTH_HEADER" \
            "${API_BASE}/repos/${REPO}/issues?state=open&type=issues&labels=${LABEL_NAME}&limit=1" \
            | jq -r '.[0].number // empty')

          PAYLOAD=$(jq -n --arg body "$BODY" '{body: $body}')

          if [ -n "$ISSUE_NUMBER" ]; then
            echo "Found existing issue #${ISSUE_NUMBER}, updating body..."
            curl -sf -X PATCH \
              -H "$AUTH_HEADER" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD" \
              "${API_BASE}/repos/${REPO}/issues/${ISSUE_NUMBER}"
          else
            echo "No existing issue found, creating one..."
            LABEL_ID=$(curl -sf -H "$AUTH_HEADER" \
              "${API_BASE}/repos/${REPO}/labels?limit=50" \
              | jq -r --arg name "$LABEL_NAME" '.[] | select(.name == $name) | .id')

            curl -sf -X POST \
              -H "$AUTH_HEADER" \
              -H "Content-Type: application/json" \
              -d "$(jq -n \
                --arg title "$ISSUE_TITLE" \
                --arg body "$BODY" \
                --argjson labels "[$LABEL_ID]" \
                '{title: $title, body: $body, labels: $labels}')" \
              "${API_BASE}/repos/${REPO}/issues"

            echo "Created issue."
          fi

          echo "Done."
