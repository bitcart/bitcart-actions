name: Lint

on:
  workflow_call:
    inputs:
      install-dependencies:
        description: "Command to install project dependencies"
        type: string
        default: ""
      extra-checks:
        description: "Extra checks to run before prek"
        type: string
        default: ""
      cache-run-data:
        description: "Cache prek repositories and data"
        type: boolean
        default: true
      setup-node:
        description: "Whether to install Node.js before linting"
        type: boolean
        default: false
      node-package-manager:
        description: "Node.js package manager to use (pnpm or yarn)"
        type: string
        default: "pnpm"
      cache-dependency-glob:
        description: "Glob pattern for uv cache. Use empty string to disable, omit to use uv default."
        type: string
        default: |
          **/pyproject.toml
          **/uv.lock
      verbose:
        description: "Pass -v to prek run for verbose output"
        type: boolean
        default: false
      turbo-cache:
        description: "Cache for Turbo build system"
        type: boolean
        default: false
      nx-cache:
        description: "Cache for Nx build system"
        type: boolean
        default: false
      runs-on:
        description: "Runner label to run the job on"
        type: string
        default: "ubuntu-latest"

permissions:
  contents: read

jobs:
  run:
    name: run
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        if: inputs.setup-node
        uses: bitcart/bitcart-actions/actions/setup-node@master
        with:
          package-manager: ${{ inputs.node-package-manager }}

      - name: Cache for Turbo
        if: inputs.turbo-cache
        uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1

      - name: Restore Nx cache
        if: inputs.nx-cache
        id: nx-cache-restore
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .nx
          key: v1-nx-${{ github.ref_name }}-${{ hashFiles('nx.json') }}
          restore-keys: |
            v1-nx-${{ github.ref_name }}-

      - name: Set up Python
        uses: bitcart/bitcart-actions/actions/setup-python@master
        with:
          cache-dependency-glob: ${{ inputs.install-dependencies != '' && inputs.cache-dependency-glob || '' }}

      - name: Install dependencies
        env:
          INSTALL_DEPENDENCIES: ${{ inputs.install-dependencies || 'uv pip install prek' }}
        run: bash -e -o pipefail <<< "$INSTALL_DEPENDENCIES"

      - name: Extra checks
        if: inputs.extra-checks != ''
        env:
          EXTRA_CHECKS: ${{ inputs.extra-checks }}
        run: bash -e -o pipefail <<< "$EXTRA_CHECKS"

      - name: Cache prek repos
        if: inputs.cache-run-data
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/prek
          key: v1-lint-${{ github.ref_name }}-prek-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            v1-lint-${{ github.ref_name }}-prek-

      - name: Run prek checks
        env:
          VERBOSE: ${{ inputs.verbose }}
        run: |
          args=()
          if [[ $VERBOSE == true ]]; then
            args+=(-v)
          fi
          prek run --color=always --all-files --show-diff-on-failure "${args[@]}"

      - name: Prune prek cache
        run: |
          prek cache gc -v || echo "Failed to prune prek cache"

      - name: Save Nx cache
        if: always() && inputs.nx-cache
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .nx
          key: ${{ steps.nx-cache-restore.outputs.cache-primary-key }}
