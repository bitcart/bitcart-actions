name: Check Docker Image

on:
  workflow_call:
    inputs:
      dockerfile:
        description: "Path to Dockerfile"
        type: string
        required: true
      context:
        description: "Docker build context path"
        type: string
        default: "."
      pre-build-script:
        description: "Optional bash script to run after checkout, before building"
        type: string
        default: ""
      prefix:
        description: "Prefix for cache scopes, useful when called from a matrix job"
        type: string
        default: ""
      amd64-runs-on:
        description: "Runner label for the linux/amd64 build job"
        type: string
        default: "ubuntu-latest"
      arm64-runs-on:
        description: "Runner label for the linux/arm64 build job"
        type: string
        default: "ubuntu-24.04-arm"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build-matrix:
    name: build-matrix-${{ matrix.suffix }}
    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ${{ inputs.amd64-runs-on }}
            platform: linux/amd64
            suffix: amd64
          - runner: ${{ inputs.arm64-runs-on }}
            platform: linux/arm64
            suffix: arm64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run pre-build script
        if: inputs.pre-build-script != ''
        env:
          SCRIPT: ${{ inputs.pre-build-script }}
        run: bash -e -o pipefail <<< "$SCRIPT"

      - name: Prepare
        id: prepare
        env:
          SUFFIX: ${{ matrix.suffix }}
          PREFIX: ${{ inputs.prefix }}
        run: |
          if [[ -n $PREFIX ]]; then
            build_scope="check-${PREFIX}-${SUFFIX}"
          else
            build_scope="check-${SUFFIX}"
          fi
          echo "build-scope=${build_scope}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ matrix.platform }}
          outputs: type=cacheonly
          cache-from: type=gha,scope=${{ steps.prepare.outputs.build-scope }}
          cache-to: type=gha,scope=${{ steps.prepare.outputs.build-scope }},mode=max
