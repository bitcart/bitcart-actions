name: Zizmor Audit

on:
  workflow_call:
    inputs:
      paths:
        description: "The paths to run the audit on"
        type: string
        default: "."
      advanced-security:
        description: "Whether to enable advanced security features (github only)"
        type: boolean
        default: true
      persona:
        description: "Zizmor persona (regular, pedantic, auditor)"
        type: string
        default: "auditor"
      runs-on:
        description: "Runner label to run the job on"
        type: string
        default: "ubuntu-latest"

permissions:
  contents: read

jobs:
  run:
    name: run
    runs-on: ${{ inputs.runs-on }}

    permissions:
      contents: read
      security-events: write # needed for github advanced security

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          inputs: ${{ inputs.paths }}
          advanced-security: ${{ inputs.advanced-security }}
          persona: ${{ inputs.persona }}
