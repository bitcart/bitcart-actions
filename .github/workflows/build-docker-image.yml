name: Build Docker Image

on:
  workflow_call:
    inputs:
      dockerfile:
        description: "Path to Dockerfile"
        type: string
        required: true
      image-name:
        description: "Full Docker Hub image name"
        type: string
        required: true
      context:
        description: "Docker build context path"
        type: string
        default: "."
      tags:
        description: "Tags configuration passed to docker/metadata-action (multiline)"
        type: string
        default: ""
      dockerhub-user:
        description: "Docker Hub username"
        type: string
        required: true
      pre-build-script:
        description: "Optional bash script to run after checkout, before building"
        type: string
        default: ""
      prefix:
        description: "Prefix for artifact names and cache scopes, useful when called from a matrix job"
        type: string
        default: ""
      amd64-runs-on:
        description: "Runner label for the linux/amd64 build job"
        type: string
        default: "ubuntu-latest"
      arm64-runs-on:
        description: "Runner label for the linux/arm64 build job"
        type: string
        default: "ubuntu-24.04-arm"
      merge-runs-on:
        description: "Runner label for the merge job"
        type: string
        default: "ubuntu-latest"
    secrets:
      dockerhub-token:
        required: true

permissions:
  contents: read

jobs:
  build-matrix:
    runs-on: ${{ matrix.runner }}
    name: build-matrix-${{ matrix.suffix }}
    permissions:
      contents: read
      packages: write # publishing to GHCR
      id-token: write # OIDC for provenance
      attestations: write # github attestations
      artifact-metadata: write # artifact storage metadata (recommended by actions/attest)
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ${{ inputs.amd64-runs-on }}
            platform: linux/amd64
            suffix: amd64
          - runner: ${{ inputs.arm64-runs-on }}
            platform: linux/arm64
            suffix: arm64

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Run pre-build script
        if: inputs.pre-build-script != ''
        env:
          SCRIPT: ${{ inputs.pre-build-script }}
        run: bash -e -o pipefail <<< "$SCRIPT"

      - name: Prepare
        id: prepare
        env:
          PLATFORM: ${{ matrix.platform }}
          SUFFIX: ${{ matrix.suffix }}
          PREFIX: ${{ inputs.prefix }}
        run: |
          platform_pair="${PLATFORM//\//-}"
          if [[ -n $PREFIX ]]; then
            build_scope="build-${PREFIX}-${SUFFIX}"
            artifact_name="${PREFIX}-digests-${platform_pair}"
          else
            build_scope="build-${SUFFIX}"
            artifact_name="digests-${platform_pair}"
          fi
          {
            echo "build-scope=${build_scope}"
            echo "artifact-name=${artifact_name}"
          } >> "$GITHUB_OUTPUT"

      - uses: bitcart/bitcart-actions/actions/login-to-registries@master
        with:
          dockerhub-user: ${{ inputs.dockerhub-user }}
          dockerhub-token: ${{ secrets.dockerhub-token }}

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: |
            ${{ inputs.image-name }}
            ghcr.io/${{ inputs.image-name }}
          tags: ${{ inputs.tags }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,"name=${{ inputs.image-name }},ghcr.io/${{ inputs.image-name }}",push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ inputs.image-name }}
            ghcr.io/${{ inputs.image-name }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=${{ steps.prepare.outputs.build-scope }}
          cache-to: type=gha,scope=${{ steps.prepare.outputs.build-scope }},mode=max

      - name: Export digest
        id: export
        env:
          IMAGE: ${{ inputs.image-name }}
          RUNNER_TEMP: ${{ runner.temp }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"
          platform_digest=$(docker buildx imagetools inspect "${IMAGE}@${DIGEST}" --raw | jq -r '.manifests[] | select(.platform.os != "unknown") | .digest')
          echo "platform-digest=${platform_digest}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.prepare.outputs.artifact-name }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Sign images with cosign
        env:
          DIGEST: ${{ steps.export.outputs.platform-digest }}
          IMAGE: ${{ inputs.image-name }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign sign --yes "ghcr.io/${IMAGE}@${DIGEST}"

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: index.docker.io/${{ inputs.image-name }}
          subject-digest: ${{ steps.export.outputs.platform-digest }}
          push-to-registry: true

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ inputs.image-name }}
          subject-digest: ${{ steps.export.outputs.platform-digest }}
          push-to-registry: true

  merge:
    name: merge
    needs: [build-matrix]
    runs-on: ${{ inputs.merge-runs-on }}
    permissions:
      contents: read
      packages: write # publishing to GHCR
      id-token: write # OIDC for provenance
      attestations: write # github attestations
      artifact-metadata: write # artifact storage metadata (recommended by actions/attest)

    steps:
      - uses: bitcart/bitcart-actions/actions/login-to-registries@master
        with:
          dockerhub-user: ${{ inputs.dockerhub-user }}
          dockerhub-token: ${{ secrets.dockerhub-token }}

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Prepare
        id: prepare
        env:
          PREFIX: ${{ inputs.prefix }}
        run: |
          if [[ -n $PREFIX ]]; then
            pattern="${PREFIX}-digests-*"
          else
            pattern="digests-*"
          fi
          echo "artifact-pattern=${pattern}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: ${{ steps.prepare.outputs.artifact-pattern }}
          merge-multiple: true

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: |
            ${{ inputs.image-name }}
            ghcr.io/${{ inputs.image-name }}
          tags: ${{ inputs.tags }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ inputs.image-name }}
        run: |
          tag_args=()
          while IFS= read -r tag; do
            tag_args+=(-t "$tag")
          done < <(jq -cr '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          digest_args=()
          for f in *; do
            digest_args+=("${IMAGE}@sha256:${f}")
          done
          docker buildx imagetools create "${tag_args[@]}" "${digest_args[@]}"

      - name: Inspect image
        id: inspect
        env:
          IMAGE: ${{ inputs.image-name }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          digest=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"

      - name: Sign images with cosign
        env:
          DIGEST: ${{ steps.inspect.outputs.digest }}
          IMAGE: ${{ inputs.image-name }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign sign --yes "ghcr.io/${IMAGE}@${DIGEST}"

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: index.docker.io/${{ inputs.image-name }}
          subject-digest: ${{ steps.inspect.outputs.digest }}
          push-to-registry: true

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ inputs.image-name }}
          subject-digest: ${{ steps.inspect.outputs.digest }}
          push-to-registry: true
