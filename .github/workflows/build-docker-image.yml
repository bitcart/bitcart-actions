name: Build Docker Image

on:
  workflow_call:
    inputs:
      dockerfile:
        description: "Path to Dockerfile"
        type: string
        required: true
      image-name:
        description: "Full Docker Hub image name"
        type: string
        required: true
      context:
        description: "Docker build context path"
        type: string
        required: false
        default: "."
      tags:
        description: "Tags configuration passed to docker/metadata-action (multiline)"
        type: string
        required: false
        default: ""
      dockerhub-user:
        description: "Docker Hub username"
        type: string
        required: true
      pre-build-script:
        description: "Optional bash script to run after checkout, before building"
        type: string
        required: false
        default: ""
      prefix:
        description: "Prefix for artifact names and cache scopes, useful when called from a matrix job"
        type: string
        required: false
        default: ""
    secrets:
      dockerhub-token:
        required: true

permissions:
  contents: read

jobs:
  build-matrix:
    runs-on: ${{ matrix.runner }}
    name: build-matrix-${{ matrix.suffix }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            suffix: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: arm64

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run pre-build script
        if: inputs.pre-build-script != ''
        env:
          SCRIPT: ${{ inputs.pre-build-script }}
        run: bash -e -o pipefail <<< "$SCRIPT"

      - name: Prepare
        id: prepare
        env:
          PLATFORM: ${{ matrix.platform }}
          SUFFIX: ${{ matrix.suffix }}
          PREFIX: ${{ inputs.prefix }}
        run: |
          platform_pair="${PLATFORM//\//-}"
          if [[ -n $PREFIX ]]; then
            build_scope="build-${PREFIX}-${SUFFIX}"
            artifact_name="${PREFIX}-digests-${platform_pair}"
          else
            build_scope="build-${SUFFIX}"
            artifact_name="digests-${platform_pair}"
          fi
          {
            echo "build-scope=${build_scope}"
            echo "artifact-name=${artifact_name}"
          } >> "$GITHUB_OUTPUT"

      - uses: bitcart/bitcart-actions/actions/login-to-registries@master
        with:
          dockerhub-user: ${{ inputs.dockerhub-user }}
          dockerhub-token: ${{ secrets.dockerhub-token }}

      - uses: docker/setup-buildx-action@v4

      - uses: sigstore/cosign-installer@v4.1.1

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: |
            ${{ inputs.image-name }}
            ghcr.io/${{ inputs.image-name }}
          tags: ${{ inputs.tags }}

      - uses: docker/build-push-action@v7
        id: build
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,"name=${{ inputs.image-name }},ghcr.io/${{ inputs.image-name }}",push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ inputs.image-name }}
            ghcr.io/${{ inputs.image-name }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=${{ steps.prepare.outputs.build-scope }}
          cache-to: type=gha,scope=${{ steps.prepare.outputs.build-scope }},mode=max

      - name: Export digest
        id: export
        env:
          IMAGE: ${{ inputs.image-name }}
          RUNNER_TEMP: ${{ runner.temp }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"
          platform_digest=$(docker buildx imagetools inspect "${IMAGE}@${DIGEST}" --raw | jq -r '.manifests[] | select(.platform.os != "unknown") | .digest')
          echo "platform-digest=${platform_digest}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.prepare.outputs.artifact-name }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Sign images with cosign
        env:
          DIGEST: ${{ steps.export.outputs.platform-digest }}
          IMAGE: ${{ inputs.image-name }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign sign --yes "ghcr.io/${IMAGE}@${DIGEST}"

      - uses: actions/attest@v4
        with:
          subject-name: index.docker.io/${{ inputs.image-name }}
          subject-digest: ${{ steps.export.outputs.platform-digest }}
          push-to-registry: true

      - uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ inputs.image-name }}
          subject-digest: ${{ steps.export.outputs.platform-digest }}
          push-to-registry: true

  merge:
    needs: [build-matrix]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - uses: bitcart/bitcart-actions/actions/login-to-registries@master
        with:
          dockerhub-user: ${{ inputs.dockerhub-user }}
          dockerhub-token: ${{ secrets.dockerhub-token }}

      - uses: docker/setup-buildx-action@v4

      - uses: sigstore/cosign-installer@v4.1.1

      - name: Prepare
        id: prepare
        env:
          PREFIX: ${{ inputs.prefix }}
        run: |
          if [[ -n $PREFIX ]]; then
            pattern="${PREFIX}-digests-*"
          else
            pattern="digests-*"
          fi
          echo "artifact-pattern=${pattern}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: ${{ steps.prepare.outputs.artifact-pattern }}
          merge-multiple: true

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: |
            ${{ inputs.image-name }}
            ghcr.io/${{ inputs.image-name }}
          tags: ${{ inputs.tags }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ inputs.image-name }}
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect image
        id: inspect
        env:
          IMAGE: ${{ inputs.image-name }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          digest=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"

      - name: Sign images with cosign
        env:
          DIGEST: ${{ steps.inspect.outputs.digest }}
          IMAGE: ${{ inputs.image-name }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign sign --yes "ghcr.io/${IMAGE}@${DIGEST}"

      - uses: actions/attest@v4
        with:
          subject-name: index.docker.io/${{ inputs.image-name }}
          subject-digest: ${{ steps.inspect.outputs.digest }}
          push-to-registry: true

      - uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ inputs.image-name }}
          subject-digest: ${{ steps.inspect.outputs.digest }}
          push-to-registry: true
