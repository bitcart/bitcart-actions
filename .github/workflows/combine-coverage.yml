name: Combine Coverage

on:
  workflow_call:
    inputs:
      runs-on:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  run:
    name: run
    runs-on: ${{ inputs.runs-on || 'ubuntu-latest' }}
    if: ${{ !cancelled() }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: bitcart/bitcart-actions/actions/setup-python@master

      - name: Install dependencies
        run: uv pip install coverage

      - name: Download all coverage data artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-data-*${{ inputs.runs-on && format('-{0}', inputs.runs-on) || '' }}
          path: coverage-data/

      - name: Download all test results artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: test-results-*${{ inputs.runs-on && format('-{0}', inputs.runs-on) || '' }}
          path: test-results-all/

      - name: Combine coverage
        run: |
          i=0
          while IFS= read -r f; do
            cp "$f" ".coverage.$i"
            i=$((i + 1))
          done < <(find coverage-data/ -name '.coverage')
          coverage combine
          coverage html -d combined-coverage/
          coverage xml -o combined-coverage/coverage.xml
          coverage report --format=markdown > combined-coverage/summary.md
          echo "## Coverage Summary" | tee -a "$GITHUB_STEP_SUMMARY"
          cat combined-coverage/summary.md | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Collect JUnit XML files
        run: |
          find test-results-all/ -name 'junit.xml' | while IFS= read -r f; do
            dir=$(basename "$(dirname "$f")")
            cp "$f" "combined-coverage/${dir}-junit.xml"
          done

      - name: Upload combined results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: combined-coverage${{ inputs.runs-on && format('-{0}', inputs.runs-on) || '' }}
          path: combined-coverage/

      - name: Display test results
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3
        if: ${{ !cancelled() }}
        with:
          name: Test Results${{ inputs.runs-on && format(' ({0})', inputs.runs-on) || '' }}
          path: combined-coverage/*-junit.xml
          reporter: python-xunit
          fail-on-error: "false"

      - name: Delete intermediate artifacts
        uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118 # v6
        with:
          name: |
            test-results-*${{ inputs.runs-on && format('-{0}', inputs.runs-on) || '' }}
            coverage-*${{ inputs.runs-on && format('-{0}', inputs.runs-on) || '' }}
            coverage-data-*${{ inputs.runs-on && format('-{0}', inputs.runs-on) || '' }}
          failOnError: false
