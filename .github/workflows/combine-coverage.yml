name: Combine Coverage

on:
  workflow_call:
    inputs:
      runs-on:
        description: "Runner label to run the job on"
        type: string
        default: "ubuntu-latest"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  run:
    name: run
    if: ${{ !cancelled() }}
    runs-on: ${{ inputs.runs-on }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: bitcart/bitcart-actions/actions/setup-python@master

      - name: Install dependencies
        env:
          # renovate: datasource=pypi depName=coverage
          COVERAGE_VERSION: "7.17.0"
        run: uv pip install "coverage==$COVERAGE_VERSION"

      - name: Download all coverage data artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-data-*-${{ inputs.runs-on }}
          path: coverage-data/

      - name: Download all test results artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: test-results-*-${{ inputs.runs-on }}
          path: test-results-all/

      - name: Combine coverage
        run: |
          i=0
          while IFS= read -r f; do
            cp "$f" ".coverage.$i"
            i=$((i + 1))
          done < <(find coverage-data/ -name '.coverage')
          coverage combine
          coverage html -d combined-coverage/
          coverage xml -o combined-coverage/coverage.xml
          coverage report --format=markdown > combined-coverage/summary.md
          echo "## Coverage Summary" | tee -a "$GITHUB_STEP_SUMMARY"
          cat combined-coverage/summary.md | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Collect JUnit XML files
        run: |
          find test-results-all/ -name 'junit.xml' | while IFS= read -r f; do
            dir=$(basename "$(dirname "$f")")
            cp "$f" "combined-coverage/${dir}-junit.xml"
          done

      - name: Upload combined results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: combined-coverage-${{ inputs.runs-on }}
          path: combined-coverage/

      - name: Display test results
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        with:
          name: Test Results (${{ inputs.runs-on }})
          path: combined-coverage/*-junit.xml
          reporter: python-xunit
          fail-on-error: "false"

      - name: Delete intermediate artifacts
        uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118 # v6.0.0
        with:
          name: |
            test-results-*-${{ inputs.runs-on }}
            coverage-*-${{ inputs.runs-on }}
          failOnError: false
