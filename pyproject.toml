[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "workflow-layout"
version = "1.0.0"
description = "Enforce the Bitcart key order, blank-line layout and permission comments in GitHub and Forgejo workflow files"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
workflow-layout = "workflow_layout:main"

[tool.hatch.build.targets.sdist]
include = ["src/workflow_layout.py"]

[tool.hatch.build.targets.wheel]
only-include = ["src/workflow_layout.py"]
sources = { "src" = "" }

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }]
