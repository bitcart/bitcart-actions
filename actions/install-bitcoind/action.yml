name: Install Bitcoin Core

description: "Install bitcoind and bitcoin-cli from a pinned Bitcoin Core release, verified against its SHA256 checksum"

runs:
  using: composite
  steps:
    - name: Install bitcoind
      env:
        BITCOIN_VERSION: "32.1"
        SHA256_X86_64: 61545c17c3120fb7412f896d248b11993af04ec8817aad3649c55b2afb044963
        SHA256_AARCH64: 7ed37c7373eb6aa3e3f72842596a1afeba1b223717033cade9842b25773e1922
      shell: bash
      run: |
        arch=$(uname -m)
        case "$arch" in
          x86_64) sha256=$SHA256_X86_64 ;;
          aarch64) sha256=$SHA256_AARCH64 ;;
          *)
            echo "::error::Unsupported architecture: $arch"
            exit 1
            ;;
        esac
        archive="bitcoin-$BITCOIN_VERSION-$arch-linux-gnu.tar.gz"
        cd "$RUNNER_TEMP"
        curl -fsSLO "https://bitcoincore.org/bin/bitcoin-core-$BITCOIN_VERSION/$archive"
        echo "$sha256  $archive" | sha256sum -c -
        tar -xzf "$archive"
        sudo install -m 0755 "bitcoin-$BITCOIN_VERSION/bin/bitcoind" "bitcoin-$BITCOIN_VERSION/bin/bitcoin-cli" /usr/local/bin/
