name: "Login to Registries"

description: "Login to Docker Hub and GitHub Container Registry"

inputs:
  dockerhub-user:
    description: "Docker Hub username, or the organization name when using OIDC"
    required: true
  dockerhub-oidc-connection-id:
    description: "Docker Hub OIDC connection ID; requires id-token: write and is used when dockerhub-token is empty"
    required: false
    default: ""
  dockerhub-token:
    description: "Docker Hub token, for logins without OIDC"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Login to Docker Hub
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      env:
        DOCKERHUB_OIDC_CONNECTIONID: ${{ inputs.dockerhub-oidc-connection-id }}
        DOCKERHUB_OIDC_EXPIREIN: 3600
      with:
        username: ${{ inputs.dockerhub-user }}
        password: ${{ inputs.dockerhub-token }}

    - name: Login to GitHub Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
