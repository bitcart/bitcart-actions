name: "Setup Go"

description: "Set up Go"

inputs:
  go-version:
    description: "Go version to install"
    required: false
    default: "1.26"
  enable-cache:
    description: "Whether to enable caching of the Go environment. Set to false to disable caching."
    default: "true"

runs:
  using: composite
  steps:
    - name: Set up Go ${{ inputs.go-version }}
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version: ${{ inputs.go-version }}
        cache: ${{ inputs.enable-cache }}
