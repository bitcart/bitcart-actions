name: "Upload Test Results"

description: "Upload test results and coverage artifacts"

inputs:
  suffix:
    description: "Suffix for artifact names"
    required: false
    default: ""
  runs-on:
    description: "Runner label to append to artifact names (matches combine-coverage filter)"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Upload test results
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: test-results${{ inputs.suffix != '' && format('-{0}', inputs.suffix) || '' }}${{ inputs.runs-on != '' && format('-{0}', inputs.runs-on) || '' }}
        path: test-results/

    - name: Upload coverage artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: coverage${{ inputs.suffix != '' && format('-{0}', inputs.suffix) || '' }}${{ inputs.runs-on != '' && format('-{0}', inputs.runs-on) || '' }}
        path: coverage/

    - name: Upload coverage data
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: coverage-data${{ inputs.suffix != '' && format('-{0}', inputs.suffix) || '' }}${{ inputs.runs-on != '' && format('-{0}', inputs.runs-on) || '' }}
        path: .coverage
        include-hidden-files: true
