name: Install Bitcart CLI

description: "Install the Bitcart CLI"

runs:
  using: composite
  steps:
    - name: Install bitcart-cli
      env:
        # renovate: datasource=github-releases depName=bitcart/bitcart-cli
        BITCART_CLI_VERSION: "1.8.0"
        SHA256_X86_64: 98e8e815c8735faff997ff54e32b3a32ec90987dbe926c82f05dd1ac1e88fcf5
        SHA256_AARCH64: 792d3ffa67755d687d3d079ef4a7b41309eb8422988085441a385f5aea55617d
      shell: bash
      run: |
        arch=$(uname -m)
        case "$arch" in
          x86_64) sha256=$SHA256_X86_64 ;;
          aarch64) sha256=$SHA256_AARCH64 ;;
          *)
            echo "::error::Unsupported architecture: $arch"
            exit 1
            ;;
        esac
        binary="bitcart-cli-linux-$arch"
        cd "$RUNNER_TEMP"
        curl -fsSLO "https://github.com/bitcart/bitcart-cli/releases/download/$BITCART_CLI_VERSION/$binary"
        echo "$sha256  $binary" | sha256sum -c -
        sudo install -m 0755 "$binary" /usr/local/bin/bitcart-cli
