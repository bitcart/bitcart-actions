name: "Setup Node.js"

description: "Set up Node.js with pnpm or yarn"

inputs:
  package-manager:
    description: "Package manager to use (pnpm or yarn)"
    required: false
    default: "pnpm"

runs:
  using: composite
  steps:
    - name: Check for package.json and .nvmrc
      id: check
      shell: bash
      env:
        PACKAGE_MANAGER: ${{ inputs.package-manager }}
      run: |
        if [[ -f package.json ]]; then
          echo "has-package-json=true" >> "$GITHUB_OUTPUT"
        else
          echo "has-package-json=false" >> "$GITHUB_OUTPUT"
        fi
        if [[ -f .nvmrc ]]; then
          echo "has-nvmrc=true" >> "$GITHUB_OUTPUT"
        else
          echo "has-nvmrc=false" >> "$GITHUB_OUTPUT"
        fi
        if [[ -f package.json && $PACKAGE_MANAGER == pnpm ]]; then
          echo "uses-pnpm=true" >> "$GITHUB_OUTPUT"
        else
          echo "uses-pnpm=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Install pnpm, Node.js and JS dependencies
      if: steps.check.outputs.uses-pnpm == 'true'
      uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
      with:
        runtime: ${{ steps.check.outputs.has-nvmrc != 'true' && 'node@24' || '' }}
        cache: true
        require-lockfile: true

    - name: Install Node.js (from .nvmrc)
      if: steps.check.outputs.uses-pnpm != 'true' && steps.check.outputs.has-nvmrc == 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: ".nvmrc"
        cache: ${{ steps.check.outputs.has-package-json == 'true' && inputs.package-manager || '' }}

    - name: Install Node.js (default)
      if: steps.check.outputs.uses-pnpm != 'true' && steps.check.outputs.has-nvmrc != 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "24"
        cache: ${{ steps.check.outputs.has-package-json == 'true' && inputs.package-manager || '' }}

    - name: Install JS dependencies
      if: steps.check.outputs.uses-pnpm != 'true' && steps.check.outputs.has-package-json == 'true'
      shell: bash
      run: yarn install --frozen-lockfile
