name: "Setup Node.js"

description: "Set up Node.js with pnpm or yarn"

inputs:
  package-manager:
    description: "Package manager to use (pnpm or yarn)"
    required: false
    default: "pnpm"

runs:
  using: composite
  steps:
    - name: Check for package.json and .nvmrc
      id: check
      shell: bash
      run: |
        if [[ -f package.json ]]; then
          echo "has-package-json=true" >> "$GITHUB_OUTPUT"
        else
          echo "has-package-json=false" >> "$GITHUB_OUTPUT"
        fi
        if [[ -f .nvmrc ]]; then
          echo "has-nvmrc=true" >> "$GITHUB_OUTPUT"
        else
          echo "has-nvmrc=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Install pnpm
      if: steps.check.outputs.has-package-json == 'true' && inputs.package-manager == 'pnpm'
      uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5

    - name: Install Node.js (from .nvmrc)
      if: steps.check.outputs.has-nvmrc == 'true'
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version-file: ".nvmrc"
        cache: ${{ steps.check.outputs.has-package-json == 'true' && inputs.package-manager || '' }}

    - name: Install Node.js (default)
      if: steps.check.outputs.has-nvmrc != 'true'
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: "24"
        cache: ${{ steps.check.outputs.has-package-json == 'true' && inputs.package-manager || '' }}

    - name: Install JS dependencies
      if: steps.check.outputs.has-package-json == 'true'
      shell: bash
      env:
        PACKAGE_MANAGER: ${{ inputs.package-manager }}
      run: |
        if [[ $PACKAGE_MANAGER == pnpm ]]; then
          pnpm install --frozen-lockfile
        else
          yarn install --frozen-lockfile
        fi
