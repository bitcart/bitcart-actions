name: Workflow Layout

description: "Check that workflows and composite actions follow the Bitcart layout, naming, permission comments and concurrency groups"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: bitcart/bitcart-actions/actions/setup-python@master
      with:
        enable-cache: "false"

    - name: Check workflow layout
      env:
        TOOL_PATH: ${{ github.action_path }}/../..
      shell: bash
      run: |
        if ! uvx --from "$TOOL_PATH" workflow-layout --check; then
          echo "::error::Workflow files don't follow the layout. Fix them with: uvx --from git+https://github.com/bitcart/bitcart-actions workflow-layout"
          exit 1
        fi
